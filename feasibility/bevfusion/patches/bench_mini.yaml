# Feasibility timing config: convfuser.yaml + nuScenes-mini overrides, batch 1.
# Sibling YAMLs are NOT inherited by torchpack (only parent default.yaml), so
# convfuser.yaml's contents are merged in here explicitly. Timing only.
model:
  fuser:
    type: ConvFuser
    in_channels:
    - 80
    - 256
    out_channels: 256
  encoders:
    camera:
      vtransform:
        add_depth_features: false
        depth_input: scalar
gt_paste_stop_epoch: -1
data:
  samples_per_gpu: 1
  workers_per_gpu: 2
  train:
    dataset:
      ann_file: ${dataset_root + "nuscenes_mini_infos_train.pkl"}
